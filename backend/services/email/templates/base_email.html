<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}LinkedIn Growth Agent{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; background-color: #f3f4f6; }
    a { color: #4f46e5; }
    @media only screen and (max-width: 600px) {
      .email-container { width: 100% !important; }
      .email-padding { padding-left: 20px !important; padding-right: 20px !important; }
      .stack-column { display: block !important; width: 100% !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6;">
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">{% block preheader %}{% endblock %}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding: 32px 16px;">
        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e5e7eb;">

          <tr>
            <td style="background: linear-gradient(90deg,#4f46e5,#7c3aed); padding: 24px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="font-family: Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; color: #ffffff;">
                    LinkedIn Growth Agent
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td class="email-padding" style="padding: 32px; font-family: Segoe UI, Arial, sans-serif; color:#1f2937;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td class="email-padding" style="padding: 24px 32px; background-color:#f9fafb; border-top:1px solid #e5e7eb; font-family: Segoe UI, Arial, sans-serif; font-size: 12px; color:#6b7280;">
              {% block footer %}
              This is an automated message from LinkedIn Growth Agent. If you weren't expecting this email, you can safely ignore it.
              {% endblock %}
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
